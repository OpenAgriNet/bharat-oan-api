# Stands in for the photon_proxy host .env already points at, so the app needs
# no code change: agents/tools/maps.py builds http://<host>:<port> and cannot
# dial an https geocoder directly.
#
# This forwards to Komoot's public Photon -- a real geocoder over real OSM data,
# not a mock. It is for local testing only: place names farmers type would leave
# the machine, and the service carries no availability promise. A deployment
# should run its own Photon with an India index and point PHOTON_HOST at it.
server {
    listen 2322;

    # Docker's embedded DNS. Named here because nginx otherwise resolves
    # proxy_pass hosts once at startup and caches the answer forever.
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream "photon.komoot.io";
        proxy_pass https://$upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host $upstream;
        proxy_http_version 1.1;

        # Komoot answers 403 to httpx's default User-Agent. Rewritten here
        # rather than in maps.py, which should stay unaware that its geocoder
        # is anything other than a plain Photon on the other side.
        proxy_set_header User-Agent "bharat-vistaar-pilot/1.0 (local testing)";
    }
}
