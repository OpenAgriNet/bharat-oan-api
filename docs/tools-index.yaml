#   MCP-OAN: python/scripts/export_vistaar_tools_manifest.py
#   API:     ./scripts/sync-vistaar-tools-manifest.sh
#
# MCP_SERVER_URL — streamable HTTP endpoint (default http://localhost:3001/mcp)

