name: CI

# A SemVer tag, with or without the v, publishes the image under that exact tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build-artifact:
    name: Build Artifact (${{ matrix.arch }})
    # One native runner per architecture; emulating arm64 on an amd64 runner is many times slower.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # amd64 only for now: requirements.lock pins an x86_64 torch wheel. Add arm64 once the lock supports it.
        arch: [amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # GHCR names must be lowercase, and the repository keeps its case (OpenAgriNet/...).
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # The package must grant this repo Write under Manage Actions access, since it was first pushed by hand.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: IMAGE_CHECK_PROFILE=production
          # A single manifest, not a provenance index, is what lets GHCR read the source label and link the package.
          provenance: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          push: true
      # Tells the publish job which images this run produced, so the architecture list lives only in the matrix.
      - name: Record the pushed image
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: echo "$IMAGE:$TAG-$ARCH" > "image-$ARCH.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish-artifact:
    # Runs only when every architecture built, so a version tag never misses one of them.
    name: Publish Artifact
    needs: build-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
      - name: Combine the architecture images under the version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -t images < <(cat image-*.txt)
          docker buildx imagetools create --tag "ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" "${images[@]}"
