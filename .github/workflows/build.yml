name: Build and Push to GCP Artifact Registry

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built Docker image to Artifact Registry
        required: true
        default: true
        type: boolean
  push:
    branches:
      - bh-dev
      - bh-main
  pull_request:
    branches:
      - bh-dev
      - bh-main

env:
  BASE_IMAGE_NAME: bharat-oan-api

# A new push to the same PR cancels its in-flight build; branch builds always finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Manual runs use the selected source branch for credentials and image tags.
    if: github.event_name != 'workflow_dispatch' || github.ref_name == 'bh-dev' || github.ref_name == 'bh-main'
    environment: ${{ github.base_ref || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # PR images are built from the PR head commit so the tag matches the code.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name and tags based on branch
        id: set-tags
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/${{ env.BASE_IMAGE_NAME }}"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR images get only pr-* tags so they never overwrite bh-dev/bh-main tags.
            # The Artifact Registry cleanup policy deletes pr-* images after 7 days.
            PR_NUMBER="${{ github.event.pull_request.number }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            TAGS="pr-${PR_NUMBER} pr-${PR_NUMBER}-${HEAD_SHA::7}"
          else
            BRANCH="${{ github.ref_name }}"
            BUILD_TAG=$(echo "$BRANCH" | sed 's/\//-/g')
            # Extract simple tag (e.g., bh-dev -> dev, bh-main -> main)
            SIMPLE_TAG=$(echo "$BRANCH" | sed 's/^.*-//')
            TAGS="${BUILD_TAG}-latest ${BUILD_TAG} ${SIMPLE_TAG} ${{ github.sha }}"
          fi

          echo "Image tags: $TAGS"
          echo "IMAGE=${REGISTRY}" >> $GITHUB_OUTPUT
          {
            echo "TAGS<<EOF"
            for TAG in $TAGS; do echo "${REGISTRY}:${TAG}"; done
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.set-tags.outputs.TAGS }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Docker image
        # Fork PRs have no GCP secrets, so they only build.
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: docker push --all-tags ${{ steps.set-tags.outputs.IMAGE }}
