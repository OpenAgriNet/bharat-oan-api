name: Build and Push to GCP Artifact Registry

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built Docker image to Artifact Registry
        required: true
        default: true
        type: boolean
  push:
    branches: [bh-dev, bh-main]
  pull_request:
    branches: [bh-dev, bh-main]

jobs:
  dev:
    name: Build dev image
    runs-on: ubuntu-latest
    if: ${{ (github.base_ref || github.ref_name) == 'bh-dev' }}
    environment: bh-dev
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/bharat-oan-api
      REGISTRY_HOST: ${{ secrets.GCP_REGION }}-docker.pkg.dev
    concurrency:
      group: build-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set dev image tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            TAGS="pr-${PR_NUMBER} pr-${PR_NUMBER}-${HEAD_SHA::7}"
          else
            TAGS="bh-dev-latest bh-dev dev $GITHUB_SHA"
          fi
          {
            echo 'images<<EOF'
            for TAG in $TAGS; do echo "$IMAGE:$TAG"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Authenticate Docker
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build dev image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: IMAGE_CHECK_PROFILE=development
          push: false
          load: true
          tags: ${{ steps.tags.outputs.images }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push dev image
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.push_image) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: docker push --all-tags "$IMAGE"

  production:
    name: Build production image
    runs-on: ubuntu-latest
    if: ${{ (github.base_ref || github.ref_name) == 'bh-main' }}
    environment: main
    env:
      IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/bharat-oan-api
      REGISTRY_HOST: ${{ secrets.GCP_REGION }}-docker.pkg.dev

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Authenticate Docker
        run: gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          build-args: IMAGE_CHECK_PROFILE=production
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:bh-main-latest
            ${{ env.IMAGE }}:bh-main
            ${{ env.IMAGE }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push production image
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.push_image)
        run: |
          docker push "$IMAGE:bh-main-latest"
          docker push "$IMAGE:bh-main"
          docker push "$IMAGE:$GITHUB_SHA"
