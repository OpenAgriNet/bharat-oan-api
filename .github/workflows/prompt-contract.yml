name: Prompt language contract

on:
  pull_request:
    branches: [main, bh-main, bh-dev]
  push:
    branches: [main, bh-main, bh-dev]

permissions:
  contents: read

jobs:
  prompt-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline prompt-test dependencies
        run: >-
          python -m pip install --only-binary=:all:
          Jinja2==3.1.6 pydantic-ai-slim[openai]==2.59.0
          python-decouple==3.8 PyYAML==6.0.3 pytest==9.1.1 langcodes[data]==3.4.0
      - name: Check prompt structure, languages, and capability loading
        env:
          PYDANTIC_AI_NO_BANNER: '1'
          OTEL_SDK_DISABLED: 'true'
        run: python -m pytest tests/test_prompt_structure.py tests/test_prompt_language_contract.py tests/test_capabilities.py tests/test_native_skills.py tests/test_backend_pydantic_contract.py tests/test_history_budget.py -q
