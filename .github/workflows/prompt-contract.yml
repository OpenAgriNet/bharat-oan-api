name: Prompt language contract

on:
  pull_request:
    branches: [main, bh-main, bh-dev]
  push:
    branches: [main, bh-main, bh-dev]

permissions:
  contents: read

jobs:
  prompt-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Install prompt-test dependency
        run: 'python -m pip install --only-binary=:all: Jinja2==3.1.6'
      - name: Check localized PMFBY instructions
        run: python -m unittest discover -s tests -p test_prompt_language_contract.py
      - name: Install isolated release-test dependencies
        run: >-
          python -m pip install pytest pytest-cov pydantic-ai-slim[openai]==1.32.0
          python-dotenv python-decouple langcodes==3.4.0 python-dateutil pytz
      - name: Check release scope and retained capabilities
        run: >-
          python -m pytest -q tests/test_release_feature_scope.py tests/test_capabilities.py
          tests/test_retained_tool_calls.py tests/test_prompt_language_contract.py
          tests/test_advisory_prompts.py tests/test_pmkisan_prompt_validation.py
          tests/test_stream_dedupe.py tests/test_guided_decoding.py
          --cov=agents --cov=app/services --cov-report=
      - name: Check capability and streaming coverage
        run: >-
          python -m coverage report
          --include='agents/capabilities.py,agents/capability_manifest.py,agents/capability_policy.py,app/services/stream_dedupe.py'
          --fail-under=80
