name: Prompt language contract

on:
  pull_request:
    branches: [main, bh-main, bh-dev]
  push:
    branches: [main, bh-main, bh-dev]

permissions:
  contents: read

jobs:
  prompt-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # PyYAML 6.0.3 has no CPython 3.15 binary wheel; keep binary-only CI installs.
          python-version: '3.13'
      - name: Install prompt and installment test dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes
          -r requirements-prompt-contract.lock
      - name: Check localized prompt instructions
        run: python -m unittest discover -s tests -p test_prompt_language_contract.py
      - name: Check PM-KISAN installment and registration flows
        run: >-
          python -m pytest -q tests/test_pmkisan_installment_release.py
          tests/test_pmkisan_prompt_validation.py
      - name: Check skill inventory, language coverage and agent loop
        run: >-
          python -m pytest -q tests/test_skills.py tests/test_skill_dependencies.py tests/test_prompt_structure.py
          tests/test_advisory_prompts.py
