name: DeepEval Gate

on:
  push:
    branches:
      - feature/deepeval-setup

env:
  BASE_IMAGE_NAME: bharat-oan-api-TEST-DEEPEVAL
  PASS_THRESHOLD: 70
  EVAL_MODEL: gpt-4.1
  OAN_API_BASE_URL: https://dev-vistaar.da.gov.in
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: Guard - allow only once per day
  # ─────────────────────────────────────────────
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Check if workflow already ran today
        id: check
        run: |
          echo "Checking previous runs..."

          TODAY=$(date -u +%Y-%m-%d)

          # github.workflow gives the *display name*, not the filename.
          # GITHUB_WORKFLOW_REF looks like:
          #   owner/repo/.github/workflows/deepeval-gate.yml@refs/heads/branch
          # Strip @ref suffix first, then extract the filename.
          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          echo "Resolved workflow file: $WORKFLOW_FILE"

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs?branch=${{ github.ref_name }}&per_page=10")

          # Guard against API errors (missing .workflow_runs key)
          if ! echo "$RESPONSE" | jq -e '.workflow_runs' > /dev/null 2>&1; then
            echo "API error or unexpected response:"
            echo "$RESPONSE" | jq . || echo "$RESPONSE"
            echo "Defaulting to should_run=true"
            echo "should_run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(echo "$RESPONSE" | jq --arg TODAY "$TODAY" '
            [.workflow_runs[]
            | select(.created_at >= ($TODAY + "T00:00:00Z"))
            ] | length')

          echo "Runs today: $COUNT"

          if [ "$COUNT" -gt 1 ]; then
            echo "Already ran today — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "First run today — proceeding"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────
  # JOB 1: DeepEval Quality Gate -- runs only if guard allows
  # ─────────────────────────────────────────────
  deepeval:
    name: DeepEval Quality Gate
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'false'

    outputs:
      gate_passed: ${{ steps.check-threshold.outputs.gate_passed }}
      pass_rate: ${{ steps.check-threshold.outputs.pass_rate }}

    steps:
      - name: ⏱ Wait for 2 minutes
        run: sleep 120

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up VPN (India IP)
        id: vpn-setup
        run: |
          set +e
          
          echo "Installing OpenVPN..."
          sudo apt-get update -qq
          sudo apt-get install -y openvpn 2>&1 || { echo "OpenVPN install failed"; exit 1; }
          
          # Check if VPN_CONFIG secret exists
          if [ -z "${{ secrets.VPN_CONFIG }}" ]; then
            echo "⚠️  WARNING: VPN_CONFIG secret not found!"
            echo "VPN will not be configured. Please add VPN_CONFIG secret to GitHub repo."
            echo "vpn_configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Decoding and setting up VPN configuration..."
          if ! echo "${{ secrets.VPN_CONFIG }}" | base64 -d > /tmp/vpn.ovpn 2>/dev/null; then
            echo "❌ Failed to decode VPN_CONFIG. Ensure it's valid base64."
            echo "vpn_configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Starting OpenVPN daemon..."
          sudo openvpn --config /tmp/vpn.ovpn --log /tmp/vpn.log --daemon --suppress-timestamps
          
          # Wait for VPN to establish
          echo "Waiting for VPN connection (15 seconds)..."
          sleep 15
          
          # Check VPN connection
          if [ -f /tmp/vpn.log ]; then
            echo "VPN Log tail:"
            tail -20 /tmp/vpn.log
          fi
          
          # Verify connection with timeout
          echo "Verifying IP location..."
          IP_RESPONSE=$(timeout 5 curl -s https://ipinfo.io/json || echo '{}')
          COUNTRY=$(echo "$IP_RESPONSE" | jq -r '.country // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
          CITY=$(echo "$IP_RESPONSE" | jq -r '.city // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")
          
          echo "Current location: $CITY, $COUNTRY"
          
          if [ "$COUNTRY" = "IN" ]; then
            echo "✅ VPN connected from India!"
            echo "vpn_configured=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  VPN may not be properly connected. Country detected: $COUNTRY"
            echo "vpn_configured=true" >> $GITHUB_OUTPUT
          fi
          
          set -e

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install deepeval

      - name: Configure DeepEval
        run: deepeval set-openai --model=${{ env.EVAL_MODEL }}

      - name: Run DeepEval tests
        id: run-evals
        run: |
          set +e
          
          # Log current environment
          echo "Running DeepEval tests..."
          echo "API Base URL: ${{ env.OAN_API_BASE_URL }}"
          echo "Python version:"
          python3 --version
          
          # Run tests with verbose output
          deepeval test run tests/evals/test_integration.py -v 2>&1 | tee eval_output.txt
          EXIT_CODE=$?
          
          echo ""
          echo "Test exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          
          set -e

      - name: Check pass rate threshold
        id: check-threshold
        run: |
          PASSED=$(grep -oP '\d+(?= passed)' eval_output.txt | tail -1 || echo "0")
          FAILED=$(grep -oP '\d+(?= failed)' eval_output.txt | tail -1 || echo "0")
          TOTAL=$((PASSED + FAILED))

          if [[ "$TOTAL" -eq 0 ]]; then
            echo "gate_passed=false" >> $GITHUB_OUTPUT
            echo "pass_rate=0" >> $GITHUB_OUTPUT
            exit 1
          fi

          PASS_RATE=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc)
          echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT

          PASS_INT=$(echo "$PASS_RATE" | cut -d'.' -f1)
          if [[ "$PASS_INT" -ge "${{ env.PASS_THRESHOLD }}" ]]; then
            echo "gate_passed=true" >> $GITHUB_OUTPUT
          else
            echo "gate_passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload eval output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepeval-results
          path: eval_output.txt