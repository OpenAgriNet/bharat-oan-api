
models:
  azure_gpt41:
    kind: azure-openai
    deployment_name: ${AZURE_OPENAI_DEPLOYMENT_NAME}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_key: ${AZURE_OPENAI_API_KEY}
    api_version: ${AZURE_OPENAI_API_VERSION}
    fallback:
      to: azure_gpt54_mini
      on_error: [ModelAPIError, APIConnectionError, TransportError, TimeoutError, UnexpectedModelBehavior]

  azure_gpt56_luna:
    kind: azure-openai
    api: responses
    model_name: gpt-5.6-luna
    base_url: ${AZURE_GPT56_LUNA_BASE_URL}
    api_key: ${AZURE_GPT56_LUNA_API_KEY}
    fallback:
      to: azure_gpt54_mini
      on_error: [ModelAPIError, APIConnectionError, TransportError, TimeoutError, UnexpectedModelBehavior]

  azure_gpt54_mini:
    kind: azure-openai
    api: responses
    model_name: gpt-5.4-mini
    settings:
      openai_reasoning_effort: none
    base_url: ${AZURE_GPT54_MINI_BASE_URL}
    api_key: ${AZURE_GPT54_MINI_API_KEY}

  gemma_vllm:
    kind: vllm
    model_name: ${AGRINET_GEMMA_MODEL_NAME}
    base_url: ${AGRINET_GEMMA_BASE_URL}
    api_key: ${AGRINET_GEMMA_API_KEY}
    fallback:
      to: azure_gpt54_mini
      on_error: [ModelAPIError, APIConnectionError, TransportError, TimeoutError, UnexpectedModelBehavior]
      on_concurrency_above: 10   # checks this model's own /metrics before sending
      metrics_cache_ttl: 2       # seconds; shared via Redis
      # metrics_url: override only when /metrics is not at {base_url}/metrics

  bharat_ai_grid_gemma:
    kind: openai
    model_name: ${BHARAT_AI_GRID_MODEL_NAME}
    base_url: ${BHARAT_AI_GRID_BASE_URL}
    api_key: ${BHARAT_AI_GRID_API_KEY}
    fallback:
      to: azure_gpt54_mini
      on_error: [ModelAPIError, APIConnectionError, TransportError, TimeoutError, UnexpectedModelBehavior]

# Use cases — which aliases each feature picks from and at what proportions.
# proportions must sum to 100. Omit proportions for a single-alias use case.
use_cases:
  moderation:
    default_alias: gemma_vllm
    aliases: [gemma_vllm]
    timeout_seconds: 20

  agrinet:
    routing_enabled: ${AGRINET_ROUTING_ENABLED}
    default_alias: azure_gpt54_mini  # used when routing is disabled or for state repair
    routing_ttl_seconds: 7200        # how long a session's sticky pick lives in Redis
    timeout_seconds: 45
    aliases: [gemma_vllm, azure_gpt54_mini]
    proportions: ["${AGRINET_PROPORTION_GEMMA_VLLM}", "${AGRINET_PROPORTION_AZURE_GPT54_MINI}"]

  suggestions:
    aliases: [azure_gpt54_mini]
    timeout_seconds: 45
