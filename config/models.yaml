
models:
  azure_gpt41:
    kind: azure-openai
    deployment_name: ${AZURE_OPENAI_DEPLOYMENT_NAME}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_key: ${AZURE_OPENAI_API_KEY}
    api_version: ${AZURE_OPENAI_API_VERSION}

  gemma_vllm:
    kind: vllm
    model_name: ${AGRINET_GEMMA_MODEL_NAME}
    base_url: ${AGRINET_GEMMA_BASE_URL}
    api_key: ${AGRINET_GEMMA_API_KEY}
    fallback:
      to: azure_gpt41
      on_error: [ModelHTTPError, TimeoutError]
      on_concurrency_above: 10   # checks this model's own /metrics before sending
      metrics_cache_ttl: 2       # seconds; shared via Redis
      # metrics_url: override only when /metrics is not at {base_url}/metrics

  bharat_ai_grid_gemma:
    kind: bharat_ai_grid
    model_name: ${BHARAT_AI_GRID_MODEL_NAME}
    base_url: ${BHARAT_AI_GRID_BASE_URL}
    api_key: ${BHARAT_AI_GRID_API_KEY}
    fallback:
      to: azure_gpt41
      on_error: [ModelHTTPError, TimeoutError]

# Use cases — which aliases each feature picks from and at what proportions.
# proportions must sum to 100. Omit proportions for a single-alias use case.
use_cases:
  moderation:
    default_alias: azure_gpt41
    aliases: [azure_gpt41]
    timeout_seconds: 20

  agrinet:
    default_alias: azure_gpt41       # used when routing is disabled or for state repair
    routing_ttl_seconds: 7200        # how long a session's sticky pick lives in Redis
    timeout_seconds: 45
    aliases: [gemma_vllm, bharat_ai_grid_gemma, azure_gpt41]
    # proportions read from env so they're changeable without a PR (all three
    # required once AGRINET_ROUTING_ENABLED=true). Set on dev to 50/0/50 --
    # same split as today, so merging this alone changes no routing behavior;
    # bump AGRINET_PROPORTION_BHARAT_AI_GRID whenever ready, no PR needed.
    proportions: ["${AGRINET_PROPORTION_GEMMA_VLLM}", "${AGRINET_PROPORTION_BHARAT_AI_GRID}", "${AGRINET_PROPORTION_AZURE}"]
