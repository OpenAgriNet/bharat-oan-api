
models:
  azure_gpt41:
    kind: azure-openai
    deployment_name: ${AZURE_OPENAI_DEPLOYMENT_NAME}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_key: ${AZURE_OPENAI_API_KEY}
    api_version: ${AZURE_OPENAI_API_VERSION}

  # Registered for future routing/fallback use. It shares the Azure resource
  # and credentials with GPT-4.1; only the deployment name is different.
  azure_gpt56_luna:
    kind: azure-openai
    deployment_name: ${AZURE_OPENAI_GPT56_LUNA_DEPLOYMENT_NAME}
    endpoint: ${AZURE_OPENAI_ENDPOINT}
    api_key: ${AZURE_OPENAI_API_KEY}
    api_version: ${AZURE_OPENAI_API_VERSION}

  gemma_vllm:
    kind: vllm
    model_name: ${AGRINET_GEMMA_MODEL_NAME}
    base_url: ${AGRINET_GEMMA_BASE_URL}
    api_key: ${AGRINET_GEMMA_API_KEY}
    capacity:
      max_concurrency: 10        # checks this model's own /metrics before sending
      metrics_cache_ttl: 2       # seconds; shared via Redis
      # metrics_url: override only when /metrics is not at {base_url}/metrics

  bharat_ai_grid_gemma:
    kind: bharat_ai_grid
    model_name: ${BHARAT_AI_GRID_MODEL_NAME}
    base_url: ${BHARAT_AI_GRID_BASE_URL}
    api_key: ${BHARAT_AI_GRID_API_KEY}

# One execution policy per use case. Every caller uses the same model service,
# so timeout and ordered fallbacks apply equally to moderation and normal chat.
# Routing proportions must sum to 100. Fallback cycles are safe: each alias is
# attempted at most once per request.
use_cases:
  moderation:
    default_alias: azure_gpt41
    aliases: [azure_gpt41]
    timeout_seconds: 20
    fallbacks:
      azure_gpt41: [gemma_vllm]

  agrinet:
    default_alias: azure_gpt41       # used when routing is disabled or for state repair
    routing_ttl_seconds: 7200        # how long a session's sticky pick lives in Redis
    timeout_seconds: 45
    aliases: [gemma_vllm, azure_gpt41]
    proportions: [50, 50]
    fallbacks:
      gemma_vllm: [azure_gpt41]
      azure_gpt41: [gemma_vllm]
